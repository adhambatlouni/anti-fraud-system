spring.application.name=anti-fraud-system
spring.profiles.default=local

spring.flyway.enabled=true
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.document-title=Anti-Fraud System API Documentation
springdoc.swagger-ui.syntax-highlight.theme=agate
